<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64" fill="none">
  <defs>
    <!-- Background Tile Gradient -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Main Ribbon Gradient: Rich purple to electric blue to vibrant cyan -->
    <linearGradient id="fav-ribbon" x1="18%" y1="88%" x2="85%" y2="15%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="25%" stop-color="#6366F1" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <!-- Top Cyan Arch Highlight -->
    <linearGradient id="fav-top-cyan" x1="10%" y1="80%" x2="95%" y2="20%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="75%" stop-color="#00C4FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Upward Career Arrow Gradient -->
    <linearGradient id="fav-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00C4FA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom Arc Gradient -->
    <linearGradient id="fav-bottom" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- 3D Fold Inner Shadow -->
    <linearGradient id="fav-fold-shadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </linearGradient>

    <!-- Dark Navy Professional Tie Gradient -->
    <linearGradient id="fav-tie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Tie Royal Blue Sheen -->
    <linearGradient id="fav-tie-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#fav-bg)" />
  <rect x="4" y="4" width="120" height="120" rx="30" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" fill="none" />

  <!-- 1. Bottom & Right Body of 'G' -->
  <path
    d="M 58 102
       C 36 102 21 87 21 66
       C 21 57 25 48 30 42
       L 43 51
       C 40 55 38 60 38 66
       C 38 78 46 87 58 87
       C 69 87 77 79 79 70
       L 62 70
       L 62 57
       L 94 57
       C 95 61 95 66 94 71
       C 90 89 75 102 58 102 Z"
    fill="url(#fav-bottom)"
  />

  <!-- 2. Left & Top Sweeping 3D Ribbon -->
  <path
    d="M 21 66
       C 21 43 37 24 60 24
       C 73 24 83 29 91 37
       L 79 47
       C 74 42 67 38 60 38
       C 45 38 37 50 37 65
       C 37 71 39 77 42 82
       L 28 92
       C 23 84 21 76 21 66 Z"
    fill="url(#fav-ribbon)"
  />

  <!-- 3. Top Cyan Arch & Highlighting -->
  <path
    d="M 40 33
       C 46 27 52 24 60 24
       C 75 24 87 30 94 39
       L 82 49
       C 77 43 69 38 60 38
       C 52 38 46 42 40 47
       L 30 38
       C 33 36 36 34 40 33 Z"
    fill="url(#fav-top-cyan)"
  />

  <!-- 4. 3D Overlapping Fold Shadow -->
  <path
    d="M 28 92
       C 32 96 37 99 44 101
       L 49 88
       C 46 86 43 83 40 80
       L 28 92 Z"
    fill="url(#fav-fold-shadow)"
  />

  <!-- 5. Upward Career Ascent Arrow -->
  <path
    d="M 77 41
       L 93 25
       L 86 20
       L 108 17
       L 106 39
       L 99 33
       L 84 48 Z"
    fill="url(#fav-arrow)"
  />

  <!-- 6. Arrow Specular Highlight -->
  <path
    d="M 93 25
       L 108 17
       L 99 33 Z"
    fill="white"
    fill-opacity="0.4"
  />

  <!-- 7. Center Necktie - Knot -->
  <polygon
    points="58,56 68,56 69,63 57,63"
    fill="url(#fav-tie-grad)"
  />
  <polygon
    points="58,56 68,56 69,63 57,63"
    fill="url(#fav-tie-sheen)"
  />

  <!-- 8. Center Necktie - Body with sharp point -->
  <polygon
    points="57,64 69,64 71,79 63,90 55,79"
    fill="url(#fav-tie-grad)"
  />
  <polygon
    points="57,64 63,64 63,90 55,79"
    fill="url(#fav-tie-sheen)"
  />
</svg>